<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Shared Content</title>
  <style>
    :root {
      --bg: #1a2e1a;
      --text: #f5f0e8;
      --accent: #d4a574;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      margin-bottom: 1.5rem;
    }

    .spinner svg {
      animation: spin 1s linear infinite;
      color: var(--accent);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    p {
      font-size: 0.9rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    .fallback-text {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner svg {
        animation: none;
      }
    }
  </style>
  <script id="redirect-script">
    (function() {
      // Extract URL parameters
      const params = new URLSearchParams(window.location.search);
      const text = params.get('text');
      const title = params.get('title');
      const url = params.get('url');

      // Build search query from shared content
      let query = '';
      if (text) {
        query = encodeURIComponent(text.trim().substring(0, 100)); // Limit to 100 chars
      } else if (title) {
        query = encodeURIComponent(title.trim().substring(0, 100));
      }

      // Redirect to index with search query
      if (query) {
        window.location.href = '../index.html?search=' + query;
      } else {
        // No valid shared content, go to index
        window.location.href = '../index.html';
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=../index.html">
  </noscript>
</head>
<body>
  <div class="container">
    <div class="spinner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 6v6l4 2"></path>
      </svg>
    </div>
    <h1>Processing Shared Content</h1>
    <p>Taking you to the Offline Compendium...</p>
    <p class="fallback-text">If you are not automatically redirected, <a href="../index.html" style="color: var(--accent); text-decoration: underline;">click here</a>.</p>
  </div>
</body>
</html>
